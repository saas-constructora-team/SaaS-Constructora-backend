spring.application.name=Constructora

# Carga de variables locales desde .env (ignorado por git).
# El archivo usa formato KEY=value; si no existe, la app arranca igual.
# .env.local lo mantiene el CLI de Neon ("neon env pull") con las cadenas de
# conexión del proyecto enlazado; también está ignorado por git.
spring.config.import=optional:file:.env[.properties],optional:file:.env.local[.properties]

# Base de datos
# Los valores se resuelven desde .env (ver .env.example); los defaults permiten
# arrancar en local sin configurar nada.
#
# Neon: cuando .env.local define DATABASE_URL / DATABASE_URL_UNPOOLED (lo escribe
# "neon env pull"), la clase shared.config.NeonJdbcConfig registra ConnectionDetails
# que sustituyen estas propiedades: el datasource principal usa la conexión agrupada
# (host con -pooler) y Flyway la conexión directa. Sin esas variables, manda esta
# configuración local.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/saas_constructora}
spring.datasource.username=${DB_USERNAME:saas}
spring.datasource.password=${DB_PASSWORD:saas}

# JPA / Hibernate (el esquema lo gestiona Flyway)
spring.jpa.hibernate.ddl-auto=validate
# Necesario para que MembershipValidationFilter habilite el filtro Hibernate
# tenantFilter sobre la sesión ligada a la petición.
spring.jpa.open-in-view=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Servidor
server.port=8080

# Resend (HU-13): envío de correos de recuperación de contraseña e invitaciones.
# La API key se inyecta por variable de entorno, nunca se versiona en el repo.
# RESEND_FROM debe ser un correo de un dominio verificado en Resend.
resend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:onboarding@resend.dev}

# Proveedor de correo (HU-13): "resend" (por defecto) o "smtp" (Gmail u otro SMTP).
# Un error de configuración o de envío se devuelve como emailSent=false en la
# respuesta; el backend ya no finge que el correo fue entregado.
# Con smtp se usan las propiedades spring.mail.* siguientes.
app.email.provider=${EMAIL_PROVIDER:resend}
app.email.from=${MAIL_FROM:${MAIL_USERNAME:}}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Google (HU-01): client-id de OAuth. Se valida que el ID token entrante haya
# sido emitido para esta aplicación (claim "aud"). Si está vacío, la validación
# falla cerrada y se rechazan todos los inicios de sesión con Google.
# Ver .env.example.
google.client-id=${GOOGLE_CLIENT_ID:}

# Frontend: base del enlace de restablecimiento enviado por correo
app.security.password-reset.base-url=${APP_BASE_URL:http://localhost:3000}
app.security.password-reset.ttl-minutes=30
app.security.jwt.private-key=${JWT_PRIVATE_KEY:}
app.security.jwt.ttl-minutes=${JWT_TTL_MINUTES:60}

# Invitaciones de trabajadores (invite-and-claim).
# El enlace enviado por correo apunta al frontend; el token se consume en
# POST /api/auth/invitations/accept. TTL por defecto: 72 horas.
app.invitation.enabled=${INVITATION_ENABLED:true}
app.invitation.base-url=${APP_INVITATION_BASE_URL:${APP_BASE_URL:http://localhost:3000}}
app.invitation.ttl-hours=${INVITATION_TTL_HOURS:72}
