spring.application.name=Constructora

# Carga de variables locales desde .env (ignorado por git).
# El archivo usa formato KEY=value; si no existe, la app arranca igual.
spring.config.import=optional:file:.env[.properties]

# Base de datos
# Los valores se resuelven desde .env (ver .env.example); los defaults permiten
# arrancar en local sin configurar nada.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/saas_constructora}
spring.datasource.username=${DB_USERNAME:saas}
spring.datasource.password=${DB_PASSWORD:saas}

# JPA / Hibernate (el esquema lo gestiona Flyway)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Servidor
server.port=8080

# Resend (HU-13): envío de correos de recuperación de contraseña
# La API key se inyecta por variable de entorno, nunca se versiona en el repo.
resend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:no-reply@constructora.local}

# Google (HU-01): client-id de OAuth. Si se define, se valida que el ID token
# entrante haya sido emitido para esta aplicación. Ver .env.example.
google.client-id=${GOOGLE_CLIENT_ID:}

# Frontend: base del enlace de restablecimiento enviado por correo
app.security.password-reset.base-url=${APP_BASE_URL:http://localhost:3000}
app.security.password-reset.ttl-minutes=30